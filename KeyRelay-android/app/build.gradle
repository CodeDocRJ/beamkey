plugins {
    id 'com.android.application'
}

android {
    namespace 'com.keyrelay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.beamkey.app"   // store-facing ID; code package (namespace) stays com.keyrelay.app
        minSdk 30          // Android 11+: framework BiometricPrompt + per-use biometric keys, no AndroidX needed
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
